name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: swift format lint --strict -r SeasonMyMac Packages/SeasonKit Scripts

  test:
    name: SeasonKit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        working-directory: Packages/SeasonKit
        run: swift test

  build:
    name: Build app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # The project uses Xcode 27's project format, which older Xcode versions
      # can't open. Skip (with a notice) until the runners have Xcode 27.
      - name: Check the Xcode version
        id: xcode
        run: |
          major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$major" -ge 27 ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=App build skipped::The project needs Xcode 27 or later; this runner has Xcode $major."
            echo "supported=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the Metal toolchain
        if: steps.xcode.outputs.supported == 'true'
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build
        if: steps.xcode.outputs.supported == 'true'
        run: |
          xcodebuild build \
            -project SeasonMyMac.xcodeproj \
            -scheme SeasonMyMac \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
